version: 2

project_name: loadgen

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/loadgen
    binary: loadgen
    env:
      - CGO_ENABLED=0
    # Префикс v ставим руками: goreleaser его срезает, а `make build` через
    # git describe оставляет — иначе loadgen -version врал бы по-разному
    # в зависимости от того, чем собирали.
    ldflags:
      - -s -w -X main.version=v{{ .Version }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
  filters:
    # Скоуп обязателен в шаблоне: '^test:' не ловит 'test(loadgen):', и такие
    # коммиты просачивались в release notes.
    #
    # refactor исключён осознанно: «split files by section and load shape»
    # читателю релиза не говорит ничего, а таких коммитов в проекте много —
    # оставить их значит утопить в них фичи.
    exclude:
      - '^docs(\(.+\))?:'
      - '^test(\(.+\))?:'
      - '^ci(\(.+\))?:'
      - '^refactor(\(.+\))?:'

  # Ломающие изменения собираются из «!» в теме коммита — признака, который
  # Conventional Commits даёт бесплатно. Раньше их приходилось выписывать
  # руками в release.header, а тот был привязан к версии и следующий тег
  # утащил бы чужой текст. Здесь устаревать нечему.
  #
  # Порядок групп значим: «feat(cli)!:» обязан попасть в Breaking changes,
  # и попадает — регулярка Features требует двоеточия сразу после скоупа
  # и на «!:» не срабатывает.
  #
  # Когда релиз заслужит пояснений от руки, для этого есть release.header;
  # держать его постоянно — значит держать текст, который никто не обновит.
  groups:
    - title: "Breaking changes"
      regexp: '^[a-z]+(\(.+\))?!:'
      order: 0
    - title: "Features"
      regexp: '^feat(\(.+\))?:'
      order: 1
    - title: "Fixes"
      regexp: '^fix(\(.+\))?:'
      order: 2
    - title: "Performance"
      regexp: '^perf(\(.+\))?:'
      order: 3
    - title: "Other"
      order: 999
