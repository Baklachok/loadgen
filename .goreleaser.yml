version: 2

project_name: loadgen

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/loadgen
    binary: loadgen
    env:
      - CGO_ENABLED=0
    # Префикс v ставим руками: goreleaser его срезает, а `make build` через
    # git describe оставляет — иначе loadgen -version врал бы по-разному
    # в зависимости от того, чем собирали.
    ldflags:
      - -s -w -X main.version=v{{ .Version }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
  filters:
    # Скоуп обязателен в шаблоне: '^test:' не ловит 'test(loadgen):', и такие
    # коммиты просачивались в release notes.
    #
    # refactor исключён осознанно: «split files by section and load shape»
    # читателю релиза не говорит ничего, а таких коммитов в проекте много —
    # оставить их значит утопить в них фичи.
    exclude:
      - '^docs(\(.+\))?:'
      - '^test(\(.+\))?:'
      - '^ci(\(.+\))?:'
      - '^refactor(\(.+\))?:'

release:
  # Шапка над автосписком. Пять ломающих изменений подряд — это не то, что
  # можно оставить на внимательность читающего перечень тем коммитов.
  #
  # ВНИМАНИЕ: текст привязан к v0.2.0. К следующему релизу его надо переписать,
  # иначе он выйдет с чужой шапкой.
  header: |
    ## Что ломается при обновлении с v0.1.x

    - **Коды выхода.** Было всегда `0`. Стало: `0` — прогон состоялся,
      `1` — ошибка использования, `2` — измерить не удалось, `3` — нарушен
      порог `-slo-*`, `130` — прервано по Ctrl+C.
    - **Недостоверные перцентили не печатаются.** `p99` меньше чем на 1000
      замерах — прочерк в отчёте и `null` в JSON. Раньше на его месте стояло
      число, которое было максимумом выборки под красивым именем.
    - **Противоречивые флаги отвергаются на старте**, кодом `1`, вместо N
      одинаковых провалов: `-n` вместе с `-z`, `-c` больше `-n` в closed-loop,
      `-d` без `-m`, URL без схемы.
    - **JSON `"schema": 2`.** Появился исход `truncated` — код ответа пришёл,
      а тело оборвалось. `failed` при этом сузился: такие ответы в него больше
      не входят. Гейт по `failed` нужно дополнить `truncated`.
    - **Заметный прогон по не-локальной цели спрашивает подтверждения** —
      `-rate` от 100, `-z` от 30s или `-n` от 10000. В скриптах — `-yes`.
