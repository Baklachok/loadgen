name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # go.sum уже дважды забывали закоммитить — пусть CI ловит это раньше людей
      - name: go.mod и go.sum в порядке
        run: go mod tidy -diff

      - name: тесты с детектором гонок
        run: go test -race ./...

      # «Команда не упала» — это не проверка, поэтому смоук сверяет числа
      # и коды выхода настоящего процесса. Тот же скрипт, что и локально.
      - name: смоук на собранном бинарнике
        run: make smoke

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1
